    <style>
      :root {
        --bg: #f7f5ef;
        --bg-soft: rgba(255, 255, 255, 0.72);
        --panel: rgba(255, 255, 255, 0.9);
        --line: rgba(116, 138, 102, 0.18);
        --line-strong: rgba(116, 138, 102, 0.28);
        --text: #2b3428;
        --text-soft: #5a6556;
        --brand: #748a66;
        --brand-strong: #617255;
        --brand-soft: rgba(116, 138, 102, 0.12);
        --shadow: 0 20px 60px rgba(70, 83, 63, 0.08);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --content-width: 1080px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Noto Serif SC", "Source Han Serif SC", "Noto Serif TC", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(201, 220, 181, 0.55), transparent 32%),
          radial-gradient(circle at right 15% top 10%, rgba(255, 214, 179, 0.35), transparent 24%),
          linear-gradient(180deg, #fbfaf5 0%, #f7f5ef 50%, #f2efe6 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image:
          linear-gradient(rgba(116, 138, 102, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 138, 102, 0.04) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: radial-gradient(circle at center, black 28%, transparent 82%);
      }

      a {
        color: var(--brand-strong);
      }

      .page-shell {
        position: relative;
        width: min(calc(100% - 24px), var(--content-width));
        margin: 0 auto;
        padding: 20px 0 48px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
        gap: 24px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.68));
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -80px -120px auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(180, 207, 152, 0.36), rgba(180, 207, 152, 0));
        pointer-events: none;
      }

      .brand-row {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }

      .brand-mark {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(219, 232, 198, 0.95), rgba(194, 214, 165, 0.82));
        display: grid;
        place-items: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .brand-mark img {
        width: 40px;
        height: 40px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand-strong);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero h1 {
        margin: 14px 0 10px;
        font-size: clamp(2.2rem, 5vw, 4.3rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .hero p {
        margin: 0;
        max-width: 64ch;
        font-size: 1rem;
        line-height: 1.72;
        color: var(--text-soft);
      }

      .hero-meta {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .meta-card {
        padding: 18px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background: var(--bg-soft);
      }

      .meta-card h2,
      .section h2 {
        margin: 0 0 8px;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .meta-card p,
      .meta-card li {
        margin: 0;
        color: var(--text-soft);
        line-height: 1.65;
        font-size: 0.96rem;
      }

      .meta-card ul,
      .section ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      .language-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .lang-btn {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        color: var(--text-soft);
        padding: 10px 14px;
        border-radius: 999px;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
        transition: 180ms ease;
      }

      .lang-btn:hover,
      .lang-btn:focus-visible {
        border-color: var(--line-strong);
        color: var(--text);
        outline: none;
        transform: translateY(-1px);
      }

      .lang-btn[aria-pressed="true"] {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
        box-shadow: 0 10px 24px rgba(116, 138, 102, 0.24);
      }

      .content-grid {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 24px;
        margin-top: 24px;
      }

      .toc,
      .content-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.74));
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .toc {
        position: sticky;
        top: 18px;
        align-self: start;
        padding: 18px;
      }

      .toc-title {
        margin: 0 0 10px;
        font-size: 0.88rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--brand-strong);
      }

      .toc-list {
        display: grid;
        gap: 8px;
      }

      .toc-list a {
        padding: 10px 12px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-soft);
        transition: 180ms ease;
      }

      .toc-list a:hover,
      .toc-list a:focus-visible {
        background: var(--brand-soft);
        color: var(--text);
        outline: none;
      }

      .content-card {
        padding: 22px;
      }

      .intro-panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .intro-item {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(247, 245, 239, 0.68);
      }

      .intro-item strong {
        display: block;
        margin-bottom: 6px;
        font-size: 0.88rem;
        color: var(--brand-strong);
        letter-spacing: 0.03em;
      }

      .intro-item span {
        display: block;
        font-size: 0.96rem;
        line-height: 1.6;
        color: var(--text-soft);
      }

      .section-list {
        display: grid;
        gap: 14px;
      }

      .section {
        padding: 18px 18px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
      }

      .section p,
      .section li {
        margin: 0;
        line-height: 1.72;
        color: var(--text-soft);
        font-size: 0.98rem;
      }

      .section p + p,
      .section p + ul,
      .section ul + p {
        margin-top: 10px;
      }

      .section ul {
        display: grid;
        gap: 8px;
      }

      .footer-card {
        margin-top: 22px;
        display: grid;
        gap: 8px;
        padding: 18px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(233, 240, 222, 0.95), rgba(248, 248, 244, 0.84));
      }

      .footer-card h2 {
        margin: 0;
        font-size: 1rem;
      }

      .footer-card p {
        margin: 0;
        line-height: 1.68;
        color: var(--text-soft);
      }

      .contact-mail {
        font-size: 1rem;
        color: var(--brand-strong);
        word-break: break-all;
      }

      .bottom-note {
        margin-top: 18px;
        text-align: center;
        color: var(--text-soft);
        font-size: 0.86rem;
      }

      @media (max-width: 920px) {
        .hero,
        .content-grid,
        .intro-panel {
          grid-template-columns: 1fr;
        }

        .toc {
          position: static;
        }
      }

      @media (max-width: 640px) {
        .page-shell {
          width: min(calc(100% - 16px), var(--content-width));
          padding-top: 8px;
        }

        .hero,
        .content-card,
        .toc {
          padding: 16px;
          border-radius: 20px;
        }

        .hero h1 {
          max-width: none;
        }
      }
    </style>

      /**
       * 解析 URL 查询参数里的 lang。
       * 如果用户显式传入 `?lang=zh-CN` 这类值，就优先使用它。
       *
       * @returns {string|null}
       */
      function getLangFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang');
        return translations[lang] ? lang : null;
      }

      /**
       * 根据浏览器语言推断当前页面语言。
       * 未命中时默认回退到英文，符合当前 Google Play 口径。
       *
       * @returns {string}
       */
      function resolveInitialLocale() {
        const explicitLang = getLangFromQuery();
        if (explicitLang) {
          return explicitLang;
        }

        const browserLang = (navigator.language || 'en-US').toLowerCase();
        if (browserLang.startsWith('zh-cn') || browserLang.startsWith('zh-sg') || browserLang === 'zh') {
          return 'zh-CN';
        }

        if (browserLang.startsWith('zh-tw') || browserLang.startsWith('zh-hk') || browserLang.startsWith('zh-mo')) {
          return 'zh-TW';
        }

        return 'en-US';
      }

      /**
       * 批量设置元素文本内容。
       *
       * @param {string} id - 元素 ID
       * @param {string} value - 需要写入的文本
       */
      function setText(id, value) {
        const element = document.getElementById(id);
        if (element) {
          element.textContent = value;
        }
      }

      /**
       * 构建语言切换按钮。
       *
       * @param {string} currentLocale - 当前语言代码
       */
      function renderLanguageSwitcher(currentLocale) {
        const container = document.getElementById('languageSwitcher');
        container.innerHTML = '';

        Object.keys(translations).forEach((locale) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'lang-btn';
          button.setAttribute('aria-pressed', String(locale === currentLocale));
          button.textContent = translations[currentLocale].languages[locale];
          button.addEventListener('click', () => {
            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('lang', locale);
            window.history.replaceState({}, '', nextUrl.toString());
            renderPage(locale);
          });
          container.appendChild(button);
        });
      }

      /**
       * 渲染目录导航。
       *
       * @param {Array<{id:string,title:string}>} sections - 当前语言的政策章节
       */
      function renderToc(sections) {
        const tocList = document.getElementById('tocList');
        tocList.innerHTML = '';

        sections.forEach((section) => {
          const link = document.createElement('a');
          link.href = `#${section.id}`;
          link.textContent = section.title;
          tocList.appendChild(link);
        });
      }

      /**
       * 渲染正文章节列表。
       *
       * @param {Array} sections - 当前语言的政策章节
       */
      function renderSections(sections) {
        const sectionList = document.getElementById('sectionList');
        sectionList.innerHTML = '';

        sections.forEach((section) => {
          const article = document.createElement('article');
          article.className = 'section';
          article.id = section.id;

          const title = document.createElement('h2');
          title.textContent = section.title;
          article.appendChild(title);

          (section.paragraphs || []).forEach((paragraphText) => {
            const paragraph = document.createElement('p');
            paragraph.textContent = paragraphText;
            article.appendChild(paragraph);
          });

          (section.lists || []).forEach((listConfig) => {
            if (listConfig.title) {
              const intro = document.createElement('p');
              intro.textContent = listConfig.title;
              article.appendChild(intro);
            }

            const list = document.createElement('ul');
            listConfig.items.forEach((itemText) => {
              const item = document.createElement('li');
              item.textContent = itemText;
              list.appendChild(item);
            });
            article.appendChild(list);
          });

          sectionList.appendChild(article);
        });
      }

      /**
       * 按语言完整渲染页面内容，并同步 `<html lang>`、meta 与目录。
       *
       * @param {string} locale - 目标语言代码
       */
      function renderPage(locale) {
        const t = translations[locale] || translations['en-US'];

        document.documentElement.lang = t.htmlLang;
        document.title = t.metaTitle;
        document.querySelector('meta[name="description"]').setAttribute('content', t.metaDescription);

        setText('eyebrow', t.eyebrow);
        setText('brandName', t.brandName);
        setText('brandSub', t.brandSub);
        setText('pageTitle', t.pageTitle);
        setText('pageIntro', t.pageIntro);
        setText('languageTitle', t.languageTitle);
        setText('quickFactsTitle', t.quickFactsTitle);
        setText('tocTitle', t.tocTitle);
        setText('effectiveDateLabel', t.effectiveDateLabel);
        setText('effectiveDateValue', EFFECTIVE_DATE);
        setText('coverageLabel', t.coverageLabel);
        setText('coverageValue', t.coverageValue);
        setText('contactTitle', t.contactTitle);
        setText('contactBody', t.contactBody);
        setText('copyrightLine', t.copyrightLine);

        const quickFactsList = document.getElementById('quickFactsList');
        quickFactsList.innerHTML = '';
        t.quickFacts.forEach((fact) => {
          const item = document.createElement('li');
          item.textContent = fact;
          quickFactsList.appendChild(item);
        });

        renderLanguageSwitcher(locale);
        renderToc(t.sections);
        renderSections(t.sections);
      }

      renderPage(resolveInitialLocale());
      document.querySelector('.contact-mail').setAttribute('href', `mailto:${CONTACT_EMAIL}`);
    </script>
