# Memory Garden CI/CD Pipeline
# v3.2: lint → test → build → bundle check

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ --max-warnings 0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vite build

      # Bundle size check: gzip < 200KB
      - name: Check bundle size
        run: |
          JS_GZIP=$(gzip -c dist/assets/index-*.js | wc -c)
          JS_GZIP_KB=$((JS_GZIP / 1024))
          echo "JS gzip size: ${JS_GZIP_KB} KB"
          if [ "$JS_GZIP_KB" -gt 200 ]; then
            echo "❌ Bundle exceeds 200KB gzip limit!"
            exit 1
          fi
          echo "✅ Bundle size OK (${JS_GZIP_KB} KB < 200 KB)"

  # Deploy to GitHub Pages (only on main push)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4
